<body>

	<h1>Drawing Shapes with SVG</h1>

    <svg width="500" height="100" style="background-color: slategrey;">
        <g transform="translate(20,0)">
            <circle cx="30", cy="50", r="45" fill="rgb(0, 204, 255)" />
            <rect x="75", y="5", width="100", height="90" fill="rgb(0, 102, 128)" />
            <ellipse cx="300" cy="50" rx="60" ry="40" fill="rgba(0, 102, 128, 0.7)"/>
            <line x1="0" y1="50" x2="400" y2="30" stroke="black" stroke-width="7" />
        </g>
    </svg>

	<footer>COS30045 Data Visualisation <br>Semester 1 2023</footer>
