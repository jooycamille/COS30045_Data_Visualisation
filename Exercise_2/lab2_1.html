<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="description" content="Data Visualitsation"/>
        <meta name="keywords" content="HTML, CSS, D3"/>
        <meta name="author" content="Joy Mena"/>

        <title>Task 2.1 & 2.2 D3 Drawing with Data - Binding/Bar Chart</title>

        <script src="https://d3js.org/d3.v6.min.js"></script>
        <link rel="stylesheet" href="lab2_1.css">

    </head>
    <body>
        <h1>The D3 Journey starts here...</h1>

        <p class="barChart"></p>
        <script>

            var w = 1000;
            var h = 350;
            var barPadding = 5; 

            var dataset = [14, 5, 26, 23, 9, 15, 0, 7, 29, 2];

            var svg = d3.select(".barChart")
            .append("svg")
            .attr("width", w)
            .attr("height", h);
            
            svg.selectAll("rect")
            .data(dataset)
            .enter()
            .append("rect")
            .attr("x", function(d, i) {
                 return i * (w / dataset.length);
            })
            .attr("y", function(d){
                return h - (d * 10); //to flip the bar
            })
            .attr("width", w / dataset.length - barPadding)
            .attr("height", function(d) {
                return d * 10;
            })
            .attr("fill", "purple");

        </script>
        <br>
        <br>
        <footer>COS30045 Data Visualitsation <br> Joy Mena</footer>
    </body>
</html>
