<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="description" content="Data Visualitsation"/>
        <meta name="keywords" content="HTML, CSS, D3"/>
        <meta name="author" content="Joy Mena"/>

        <title>Task 2.1 D3 Data Binding</title>

        <script src="https://d3js.org/d3.v6.min.js"></script>

    </head>
    <body>
        <h1>The D3 Journey starts here...</h1>

        <script>

            var dataset = [14, 5, 26, 23, 9];

            d3.select("body").selectAll("p")
            .data(dataset)
            .enter()
            .append("p")
            .text(function(d, i) {
                return "i = " + i + " d = " + d;
            });

        </script>

        <br>

    </body>
</html>
